<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>ФайлДроп — передача файлов</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #141e33;
      --accent: #38bdf8;
      --accent2: #22c55e;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --danger: #f87171;
      --border: #243047;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1e3a5f 0%, transparent 55%),
                  radial-gradient(900px 500px at 100% 0%, #14532d33 0%, transparent 50%),
                  var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    header { text-align: center; margin: 12px 0 20px; }
    h1 { font-size: 1.6rem; margin: 0 0 6px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 0.95rem; margin: 0; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
      background: var(--card);
      padding: 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .tabs button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 12px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tabs button.active {
      background: #1e293b;
      color: var(--text);
      box-shadow: 0 0 0 1px var(--border);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
    }
    .drop {
      border: 2px dashed #334155;
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      transition: border-color .15s, background .15s;
      cursor: pointer;
      touch-action: manipulation;
    }
    .drop.drag { border-color: var(--accent); background: #0c4a6e33; }
    .drop p { margin: 8px 0 0; color: var(--muted); font-size: 0.9rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      touch-action: manipulation;
    }
    .btn-primary { background: var(--accent); color: #082f49; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-secondary { background: #1e293b; color: var(--text); border: 1px solid var(--border); }
    .btn-ok { background: var(--accent2); color: #052e16; }
    input[type="text"], input[type="file"] {
      width: 100%;
      font-size: 1.15rem;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
    }
    .file-list { list-style: none; padding: 0; margin: 12px 0 0; }
    .file-list li {
      display: flex; justify-content: space-between; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
    }
    .file-list li span:last-child { color: var(--muted); white-space: nowrap; }
    .code-big {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.28em;
      text-align: center;
      margin: 8px 0 4px;
      font-variant-numeric: tabular-nums;
    }
    .link-box {
      word-break: break-all;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.9rem;
      color: var(--accent);
    }
    .qr { display: block; margin: 14px auto; width: min(240px, 70vw); border-radius: 12px; background: #fff; padding: 8px; }
    .muted { color: var(--muted); font-size: 0.85rem; text-align: center; }
    .err { color: var(--danger); margin-top: 10px; text-align: center; }
    .ok { color: var(--accent2); margin-top: 10px; text-align: center; }
    .hidden { display: none !important; }
    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1; }
    progress {
      width: 100%; height: 10px; margin-top: 12px;
      accent-color: var(--accent);
    }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>ФайлДроп</h1>
      <p class="sub">Передача файлов между устройствами по коду или ссылке</p>
    </header>

    <div class="tabs">
      <button type="button" id="tabUp" class="active">Отправить</button>
      <button type="button" id="tabDown">Получить</button>
    </div>

    <section id="panelUp">
      <div class="card">
        <div class="drop" id="drop">
          <strong>Перетащите файлы сюда</strong>
          <p>или нажмите, чтобы выбрать</p>
          <input type="file" id="fileInput" multiple class="hidden" />
        </div>
        <ul class="file-list" id="selected"></ul>
        <progress id="progress" value="0" max="100" class="hidden"></progress>
        <button class="btn btn-primary" id="btnUpload" disabled>Загрузить</button>
        <p class="muted" id="limits"></p>
        <p class="err hidden" id="upErr"></p>
      </div>

      <div class="card hidden" id="result">
        <p class="muted">Код для скачивания</p>
        <div class="code-big" id="codeOut"></div>
        <p class="muted" id="expiresOut"></p>
        <img class="qr" id="qrOut" alt="QR-код" />
        <p class="muted">или откройте ссылку</p>
        <div class="link-box" id="linkOut"></div>
        <div class="row" style="margin-top:12px">
          <button class="btn btn-secondary" id="btnCopyCode" type="button">Копировать код</button>
          <button class="btn btn-secondary" id="btnCopyLink" type="button">Копировать ссылку</button>
        </div>
        <button class="btn btn-ok" id="btnAgain" type="button">Отправить ещё</button>
      </div>
    </section>

    <section id="panelDown" class="hidden">
      <div class="card">
        <label class="muted" for="codeIn" style="display:block;margin-bottom:8px;text-align:center">Введите 6-символьный код</label>
        <input type="text" id="codeIn" maxlength="6" inputmode="text" autocomplete="off" placeholder="ABC123" />
        <button class="btn btn-primary" id="btnFind" type="button">Найти файлы</button>
        <p class="err hidden" id="downErr"></p>
      </div>
      <div class="card hidden" id="downResult">
        <p class="muted" id="downMeta"></p>
        <ul class="file-list" id="downFiles"></ul>
      </div>
    </section>

    <footer id="footerNote">Файлы хранятся ограниченное время и удаляются автоматически.</footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let config = { maxMb: 200, ttlHours: 24 };
    let picked = [];

    function fmtSize(n) {
      if (n < 1024) return n + ' Б';
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' КБ';
      return (n / (1024 * 1024)).toFixed(1) + ' МБ';
    }

    function fmtWhen(ts) {
      try {
        return new Date(ts).toLocaleString('ru-RU', { timeZone: 'Europe/Moscow' });
      } catch {
        return new Date(ts).toLocaleString('ru-RU');
      }
    }

    async function loadConfig() {
      try {
        const r = await fetch('/api/config');
        config = await r.json();
      } catch {}
      $('limits').textContent = `До ${config.maxMb} МБ · хранение ${config.ttlHours} ч`;
      $('footerNote').textContent =
        `Файлы удаляются через ${config.ttlHours} ч. Лимит ${config.maxMb} МБ. На бесплатном хостинге сервис может «засыпать», а файлы пропасть после перезапуска.`;
    }

    function renderSelected() {
      const ul = $('selected');
      ul.innerHTML = '';
      picked.forEach((f, i) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${f.name}</span><span>${fmtSize(f.size)}</span>`;
        ul.appendChild(li);
      });
      $('btnUpload').disabled = !picked.length;
    }

    function setFiles(fileList) {
      picked = Array.from(fileList || []);
      const over = picked.find((f) => f.size > config.maxMb * 1024 * 1024);
      if (over) {
        $('upErr').textContent = `«${over.name}» больше лимита ${config.maxMb} МБ`;
        $('upErr').classList.remove('hidden');
        picked = [];
      } else {
        $('upErr').classList.add('hidden');
      }
      renderSelected();
    }

    $('drop').addEventListener('click', () => $('fileInput').click());
    $('fileInput').addEventListener('change', (e) => setFiles(e.target.files));
    ['dragenter', 'dragover'].forEach((ev) => {
      $('drop').addEventListener(ev, (e) => {
        e.preventDefault();
        $('drop').classList.add('drag');
      });
    });
    ['dragleave', 'drop'].forEach((ev) => {
      $('drop').addEventListener(ev, (e) => {
        e.preventDefault();
        $('drop').classList.remove('drag');
      });
    });
    $('drop').addEventListener('drop', (e) => setFiles(e.dataTransfer.files));

    $('tabUp').onclick = () => {
      $('tabUp').classList.add('active');
      $('tabDown').classList.remove('active');
      $('panelUp').classList.remove('hidden');
      $('panelDown').classList.add('hidden');
    };
    $('tabDown').onclick = () => {
      $('tabDown').classList.add('active');
      $('tabUp').classList.remove('active');
      $('panelDown').classList.remove('hidden');
      $('panelUp').classList.add('hidden');
    };

    $('btnUpload').onclick = () => {
      if (!picked.length) return;
      const fd = new FormData();
      picked.forEach((f) => fd.append('files', f));
      $('upErr').classList.add('hidden');
      $('btnUpload').disabled = true;
      $('progress').classList.remove('hidden');
      $('progress').value = 0;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) $('progress').value = Math.round((e.loaded / e.total) * 100);
      };
      xhr.onload = () => {
        $('progress').classList.add('hidden');
        let data;
        try { data = JSON.parse(xhr.responseText); } catch { data = {}; }
        if (xhr.status >= 400) {
          $('upErr').textContent = data.error || 'Ошибка загрузки';
          $('upErr').classList.remove('hidden');
          $('btnUpload').disabled = false;
          return;
        }
        $('codeOut').textContent = data.code;
        $('linkOut').textContent = data.link;
        $('qrOut').src = data.qrDataUrl || '';
        $('expiresOut').textContent = 'Действует до ' + fmtWhen(data.expiresAt) + ' (МСК)';
        $('result').classList.remove('hidden');
        $('drop').parentElement.classList.add('hidden');
      };
      xhr.onerror = () => {
        $('progress').classList.add('hidden');
        $('upErr').textContent = 'Сеть недоступна';
        $('upErr').classList.remove('hidden');
        $('btnUpload').disabled = false;
      };
      xhr.send(fd);
    };

    $('btnAgain').onclick = () => {
      picked = [];
      $('fileInput').value = '';
      renderSelected();
      $('result').classList.add('hidden');
      $('drop').parentElement.classList.remove('hidden');
      $('btnUpload').disabled = true;
    };

    async function copyText(t) {
      try {
        await navigator.clipboard.writeText(t);
        return true;
      } catch {
        return false;
      }
    }
    $('btnCopyCode').onclick = async () => {
      const ok = await copyText($('codeOut').textContent.trim());
      $('btnCopyCode').textContent = ok ? 'Скопировано' : 'Не удалось';
      setTimeout(() => { $('btnCopyCode').textContent = 'Копировать код'; }, 1500);
    };
    $('btnCopyLink').onclick = async () => {
      const ok = await copyText($('linkOut').textContent.trim());
      $('btnCopyLink').textContent = ok ? 'Скопировано' : 'Не удалось';
      setTimeout(() => { $('btnCopyLink').textContent = 'Копировать ссылку'; }, 1500);
    };

    async function lookup(code) {
      code = (code || '').trim().toUpperCase();
      $('downErr').classList.add('hidden');
      $('downResult').classList.add('hidden');
      if (code.length !== 6) {
        $('downErr').textContent = 'Нужен код из 6 символов';
        $('downErr').classList.remove('hidden');
        return;
      }
      const r = await fetch('/api/info/' + encodeURIComponent(code));
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        $('downErr').textContent = data.error || 'Не найдено';
        $('downErr').classList.remove('hidden');
        return;
      }
      $('downMeta').textContent = `Код ${data.code} · до ${fmtWhen(data.expiresAt)} (МСК)`;
      const ul = $('downFiles');
      ul.innerHTML = '';
      data.files.forEach((f, i) => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = `/api/download/${data.code}/${i}`;
        a.textContent = f.name;
        a.style.color = 'var(--accent)';
        const sz = document.createElement('span');
        sz.textContent = fmtSize(f.size);
        li.appendChild(a);
        li.appendChild(sz);
        ul.appendChild(li);
      });
      $('downResult').classList.remove('hidden');
    }

    $('btnFind').onclick = () => lookup($('codeIn').value);
    $('codeIn').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') lookup($('codeIn').value);
    });

    // Deep link /d/CODE
    const m = location.pathname.match(/^\/d\/([A-Za-z0-9]{6})$/);
    if (m) {
      $('tabDown').click();
      $('codeIn').value = m[1].toUpperCase();
      lookup(m[1]);
    }

    loadConfig();
  </script>
</body>
</html>
